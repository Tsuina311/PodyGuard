name: Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build the always-on site
        env:
          GITHUB_PAGES: "true"
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "Set repository variable API_ORIGIN to the Render origin, e.g. https://podyguard.onrender.com"
            exit 1
          fi
          export VITE_API_URL="$API_ORIGIN"
          if [ -n "$PUBLIC_SITE_URL" ]; then
            export VITE_PUBLIC_ORIGIN="$PUBLIC_SITE_URL"
          else
            OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            export VITE_PUBLIC_ORIGIN="https://${OWNER}.github.io/${{ github.event.repository.name }}"
          fi
          echo "VITE_PUBLIC_ORIGIN=${VITE_PUBLIC_ORIGIN}"
          echo "VITE_API_URL=${VITE_API_URL}"
          RELEASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "RELEASE_VERSION=${RELEASE_VERSION}"
          yarn workspace @podyguard/shared build
          yarn workspace @podyguard/matching build
          yarn workspace @podyguard/web build
          # Fail loudly if the bundle would emit a dangerous player origin.
          if ! grep -R -l --include='*.js' 'github.io' apps/web/dist >/dev/null; then
            echo "Pages build missing github.io public origin marker"
            exit 1
          fi
          if grep -R --include='*.js' -E 'podyguard\.onrender\.com/#/e/|localhost:5173/\?join=' apps/web/dist; then
            echo "Pages build contains a dangerous join URL pattern"
            exit 1
          fi
          if ! grep -R --include='*.js' -F "${RELEASE_VERSION}" apps/web/dist >/dev/null; then
            echo "Pages build missing release version ${RELEASE_VERSION}"
            exit 1
          fi
          echo "PAGES BUILD: PASS (v${RELEASE_VERSION})"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
