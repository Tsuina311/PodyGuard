# Render free instances sleep after ~15 minutes without HTTP traffic.
# This workflow is best-effort only: GitHub may delay cron jobs by many minutes
# when the runner pool is busy. Observed gaps regularly exceed 15 minutes, so
# this does NOT guarantee the free instance stays awake.
#
# For alpha testing, also point an external uptime monitor at /health with an
# interval comfortably under 15 minutes (for example every 5–10 minutes).
name: Keep API awake

on:
  schedule:
    # Nominally every 10 minutes. Treat delays as normal, not a bug in this file.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "Set repository variable API_ORIGIN (same as the Pages workflow)."
            exit 1
          fi
          origin="${API_ORIGIN%/}"
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "keep-alive start=${started}"
          echo "GET ${origin}/health"
          body="$(curl -fsS --retry 2 --retry-delay 5 --max-time 90 "${origin}/health")"
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "keep-alive finish=${finished}"
          echo "body=${body}"
          echo "${body}" | grep -q '"ok":true'
