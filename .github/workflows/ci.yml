name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Placeholder so config loads; unit tests do not require a live database.
      # Integration/migration checks against a real DB are out of band.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/podyguard_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build production artifacts
        run: yarn build
