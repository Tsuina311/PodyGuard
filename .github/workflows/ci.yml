name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUSKY: '0'
      # Placeholder so config loads; unit tests do not require a live database.
      # Integration/migration checks against a real DB are out of band.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/podyguard_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build production artifacts
        run: yarn build

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/
          retention-days: 14

      - name: Pages-shaped web production build
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_API_URL: https://podyguard.onrender.com
          VITE_PUBLIC_ORIGIN: https://tsuina311.github.io/PodyGuard
        run: |
          yarn workspace @podyguard/web build
          test -f apps/web/dist/index.html
          grep -R -l --include='*.js' 'tsuina311.github.io' apps/web/dist
          echo "PAGES-SHAPED BUILD: PASS"

  browser:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @podyguard/web build
      - run: yarn playwright install --with-deps chromium
      - name: Commander, playgroups and Limited browser journeys
        run: yarn playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            reports/e2e.xml
          retention-days: 14
      - name: Repeat critical Commander journeys nightly
        if: github.event_name == 'schedule'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-repeat-report
        run: yarn playwright test commander-lobby --repeat-each=3 --output=test-repeat-results
      - name: Upload repeated-run evidence
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-repeat-report
          path: |
            playwright-repeat-report/
            test-repeat-results/
          retention-days: 14
