name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Placeholder so config loads; unit tests do not require a live database.
      # Integration/migration checks against a real DB are out of band.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/podyguard_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build production artifacts
        run: yarn build

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: End-to-end (constructed vs Limited screens)
        run: yarn playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Pages-shaped web production build
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_API_URL: https://podyguard.onrender.com
          VITE_PUBLIC_ORIGIN: https://tsuina311.github.io/PodyGuard
        run: |
          yarn workspace @podyguard/web build
          test -f apps/web/dist/index.html
          grep -R -l --include='*.js' 'tsuina311.github.io' apps/web/dist
          echo "PAGES-SHAPED BUILD: PASS"