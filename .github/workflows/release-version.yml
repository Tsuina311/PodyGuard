name: Release version

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: release-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the base branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Test release rules
        run: node --test scripts/release-version.test.mjs
      - name: Validate the proposed release
        run: node scripts/check-release-version.mjs
