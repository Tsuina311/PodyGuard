services:
  - type: web
    name: podyguard
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && yarn install --immutable && yarn build
    startCommand: yarn db:migrate && yarn workspace @podyguard/server start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PARTICIPANT_SESSION_SECRET
        generateValue: true
      - key: GITHUB_FEEDBACK_TOKEN
        sync: false
      - key: GITHUB_FEEDBACK_REPO
        sync: false
      # Canonical always-on player site for QR / copy links (never the Render URL).
      - key: VITE_PUBLIC_ORIGIN
        value: https://tsuina311.github.io/PodyGuard
      # Render-hosted UI talks to the same origin; leave empty.
      - key: VITE_API_URL
        value: ""
